name: Verify public RC

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fixed source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/product3_ppt_pipeline/automizer_adapter/package-lock.json

      - name: Verify release inventory
        run: |
          python3 scripts/generate_third_party_inventory.py --check
          python3 scripts/build_release_manifest.py --check

      - name: Run Python public-core tests
        run: python3 tests/run_public_tests.py

      - name: Verify v0.2 production-path tutorial
        run: |
          python3 scripts/check_environment.py --profile production-core
          python3 scripts/verify_production_run.py examples/production-path-tutorial/expected --mode tutorial
          python3 scripts/verify_revision_tutorial.py examples/production-path-revision

      - name: Install locked Node dependencies
        working-directory: tools/product3_ppt_pipeline/automizer_adapter
        run: npm ci --ignore-scripts

      - name: Verify PPTX structural adapter
        working-directory: tools/product3_ppt_pipeline/automizer_adapter
        run: npm run verify

      - name: Verify static-bundle tools
        run: node --test tools/ue_static_bundle/test/*.test.mjs

      - name: Run historical RC1 carrier reference flow
        run: python3 scripts/run_rc1_demo.py --install-node-deps

      - name: Prepare historical RC1 carrier handoff
        run: python3 scripts/prepare_external_cold_start.py
